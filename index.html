<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مصنع الأسئلة · رياضيات ٢ إعدادي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&family=Noto+Sans+Math&family=Space+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#05060f; --ink:#eef2ff; --mut:#94a3b8;
  --cy:#22d3ee; --vi:#8b5cf6; --pk:#f472b6; --li:#a3e635; --am:#fbbf24;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',sans-serif;min-height:100vh;overflow-x:hidden}

/* ============ خلفية مستقبلية ============ */
.bg{position:fixed;left:0;top:0;right:0;bottom:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;animation:float 18s ease-in-out infinite}
.b1{width:520px;height:520px;background:#6d28d9;top:-140px;right:-120px}
.b2{width:460px;height:460px;background:#0891b2;bottom:-120px;left:-100px;animation-delay:-6s}
.b3{width:380px;height:380px;background:#be185d;top:40%;left:35%;opacity:.28;animation-delay:-11s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-50px) scale(1.12)}}
.gridbg{position:absolute;left:0;top:0;right:0;bottom:0;
  background-image:linear-gradient(rgba(148,163,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,255,.07) 1px,transparent 1px);
  background-size:54px 54px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 25%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 30%,#000 25%,transparent 75%)}
.scan{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(34,211,238,.6),transparent);animation:scan 7s linear infinite}
@keyframes scan{from{top:-5%}to{top:105%}}

/* ============ الهيرو ============ */
.hero{max-width:1040px;margin:0 auto;padding:54px 20px 18px;text-align:center;position:relative}
.orbit{width:116px;height:116px;margin:0 auto 14px;position:relative}
.orbit svg{width:100%;height:100%;overflow:visible}
.orbit .r1{transform-origin:58px 58px;animation:spin 9s linear infinite}
.orbit .r2{transform-origin:58px 58px;animation:spin 14s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.eyebrow{display:inline-flex;gap:8px;align-items:center;padding:6px 16px;border-radius:999px;border:1px solid rgba(34,211,238,.4);background:rgba(34,211,238,.08);color:#a5f3fc;font-size:14px;font-weight:500}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--cy);box-shadow:0 0 12px var(--cy);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
h1{margin:16px 0 8px;font-weight:700;font-size:clamp(34px,6.4vw,66px);line-height:1.2;
  background:linear-gradient(100deg,#67e8f9,#a78bfa 40%,#f472b6 70%,#fbbf24);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
@keyframes shine{to{background-position:-220% 0}}
.sub{color:#b4bfe6;font-size:clamp(15px,2.4vw,19px);font-weight:300;max-width:640px;margin:0 auto;line-height:1.9}

/* ============ شريط الأدوات ============ */
.toolbar{position:sticky;top:10px;z-index:30;max-width:1000px;margin:22px auto 26px;padding:12px 14px;
  border-radius:22px;border:1px solid rgba(165,180,252,.25);background:rgba(10,12,36,.72);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 18px 50px rgba(0,0,0,.45);
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.05);padding:5px;border-radius:16px}
.tab{border:0;cursor:pointer;color:#c7d2fe;background:transparent;font:500 15px 'IBM Plex Sans Arabic';padding:10px 18px;border-radius:12px;transition:.25s}
.tab:hover{color:#fff;background:rgba(255,255,255,.07)}
.tab.on{color:#06081a;font-weight:700;background:linear-gradient(135deg,#67e8f9,#a78bfa);box-shadow:0 6px 22px rgba(103,232,249,.35)}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sel{display:flex;align-items:center;gap:6px;color:#a5b4fc;font-size:13px}
select{appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(165,180,252,.3);border-radius:12px;padding:9px 14px;font:500 14px 'IBM Plex Sans Arabic';cursor:pointer}
select option{color:#111}
.tg{display:flex;align-items:center;gap:8px;color:#c7d2fe;font-size:14px;cursor:pointer;user-select:none}
.sw{width:42px;height:24px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;transition:.25s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.25s}
.tg input{display:none}
.tg input:checked+.sw{background:linear-gradient(135deg,#22d3ee,#8b5cf6)}
.tg input:checked+.sw::after{right:21px}
.zipbtn{border:0;cursor:pointer;color:#06081a;font:700 14px 'IBM Plex Sans Arabic';padding:10px 18px;border-radius:14px;background:linear-gradient(135deg,#a3e635,#22d3ee);box-shadow:0 8px 24px rgba(163,230,53,.28);transition:.25s}
.zipbtn:hover{transform:translateY(-2px)}

/* ============ قائمة الأسئلة ============ */
main{max-width:1000px;margin:0 auto;padding:0 14px 60px}
.q{position:relative;margin:0 auto 34px;max-width:960px;animation:rise .6s both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.fit{position:relative;width:100%}
.fit>.export-card{position:absolute;right:0;top:0;transform-origin:100% 0}

/* زر التصدير المتحرك */
.exp{position:absolute;top:22px;left:24px;width:60px;height:60px;border-radius:50%;border:0;padding:0;cursor:pointer;background:transparent;z-index:5;isolation:isolate}
.exp .ring{position:absolute;left:-3px;top:-3px;right:-3px;bottom:-3px;border-radius:50%;background:conic-gradient(#22d3ee,#8b5cf6,#f472b6,#fbbf24,#22d3ee);animation:spin 3.2s linear infinite;z-index:-2}
.exp .core{position:absolute;left:0;top:0;right:0;bottom:0;border-radius:50%;background:#0a0c24;z-index:-1;transition:.25s}
.exp::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;border-radius:50%;box-shadow:0 0 0 0 rgba(34,211,238,.6);animation:pulse 2.2s infinite;z-index:-3}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,211,238,.55)}80%,100%{box-shadow:0 0 0 20px rgba(34,211,238,0)}}
.exp svg{width:28px;height:28px;display:block;position:absolute;left:50%;top:50%;margin:-14px 0 0 -14px;overflow:visible}
.exp .arrow{animation:bob 1.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px)}}
.exp:hover .core{background:#171a4a}
.exp:hover{transform:scale(1.1)}
.exp:active{transform:scale(.94)}
.exp .ok,.exp .spn{display:none}
.exp.busy .arrow,.exp.busy .tray{display:none}
.exp.busy .spn{display:block;transform-origin:14px 14px;animation:spin .8s linear infinite}
.exp.done .arrow,.exp.done .tray{display:none}
.exp.done .ok{display:block}
.exp .tip{position:absolute;top:70px;left:50%;transform:translateX(-50%);white-space:nowrap;font:500 12px 'IBM Plex Sans Arabic';color:#cffafe;background:#0a0c24;border:1px solid rgba(34,211,238,.4);padding:4px 10px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s}
.exp:hover .tip{opacity:1}

/* شريط الإجابة (لا يُصدَّر) */
.ans{margin:12px 6px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;border-radius:16px;
  border:1px dashed rgba(163,230,53,.5);background:rgba(163,230,53,.07);color:#d9f99d;font-size:16px}
.ans .lock{font-size:13px;color:#86efac;opacity:.85}
.ans b{display:inline-grid;place-items:center;min-width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#bef264,#4ade80);color:#052e16;font-size:19px}
.ans .m{color:#ecfccb}
body.hide-ans .ans{display:none}

/* ============ بطاقة التصدير (ما يظهر في الصورة) ============ */
.export-card{width:960px;padding:34px 38px 26px;border-radius:30px;direction:rtl;color:#eef2ff;
  font-family:'IBM Plex Sans Arabic',sans-serif;position:relative;overflow:hidden;
  background:radial-gradient(520px 260px at 90% -5%,rgba(139,92,246,.5),rgba(139,92,246,0) 70%),
             radial-gradient(520px 300px at -5% 105%,rgba(34,211,238,.3),rgba(34,211,238,0) 70%),
             linear-gradient(160deg,#0a0c24 0%,#12123a 55%,#1b1040 100%);
  border:2px solid rgba(129,140,248,.5)}
.ec-head{display:flex;align-items:center;gap:18px;padding-left:84px;min-height:62px}
.qn{display:flex;align-items:baseline;gap:8px;padding:8px 20px;border-radius:16px;
  background:linear-gradient(135deg,rgba(34,211,238,.22),rgba(139,92,246,.28));border:1.5px solid rgba(34,211,238,.6)}
.qn small{font-size:18px;color:#a5f3fc;font-weight:500}
.qn b{font:700 34px/1.1 'Space Grotesk',sans-serif;color:#fff}
.ec-title{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ec-title span{font-size:21px;font-weight:500;color:#b4bfff}
.ec-title em{font-style:normal;font-size:17px;font-weight:600;color:#fbcfe8;padding:4px 16px;border-radius:999px;background:rgba(244,114,182,.18);border:1.5px solid rgba(244,114,182,.55)}
.banner{position:relative;height:176px;margin:20px 0 22px;border-radius:22px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(circle at 1px 1px,rgba(165,180,252,.24) 1.4px,rgba(165,180,252,0) 1.7px) 0 0/22px 22px,linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  border:1.5px solid rgba(165,180,252,.28)}
.fig-tag{position:absolute;top:10px;left:16px;font-size:13px;font-weight:500;color:#93c5fd;opacity:.85}
.fig{position:relative;width:600px;height:160px;flex:none}
.fig svg{position:absolute;left:0;top:0}
.ec-head+.qt{margin-top:30px}
.figl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;direction:rtl;font-weight:600;line-height:1.2;text-align:center}
.qt{font-size:36px;font-weight:600;line-height:1.8;color:#f8fafc;margin:4px 4px 24px}
.m{font-family:'STIX Two Text','Noto Sans Math','Cambria Math',serif;font-weight:500;font-size:1.14em;direction:ltr;unicode-bidi:isolate;white-space:nowrap;display:inline-block;color:#c4f1ff}
.m i{font-style:italic}
.m sup{font-size:.66em;line-height:0;position:relative;top:-.12em;margin-left:1px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;font-size:.88em;line-height:1.2}
.fr>span:first-child{border-bottom:.07em solid currentColor;padding:0 .25em .06em}
.fr>span:last-child{padding:.22em .25em 0}
.rad{display:inline-block;white-space:nowrap}
.rad .ix{font-size:.55em;position:relative;top:-.62em;margin-right:-.1em}
.rad .rs{display:inline-block;font-size:1.08em}
.rad .rc{display:inline-block;border-top:.075em solid currentColor;padding:.05em .12em 0 .1em;margin-left:-.1em;line-height:1.2}
.blank{display:inline-block;width:78px;height:0;border-bottom:3px dashed rgba(251,191,36,.9);margin:0 6px;vertical-align:-.1em}
.opts{display:grid;gap:14px}
.cols4{grid-template-columns:repeat(4,1fr)}
.cols2{grid-template-columns:repeat(2,1fr)}
.opt{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:20px;min-height:76px;
  background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.18)}
.lt{flex:none;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#06081a;line-height:1}
.c0 .lt{background:linear-gradient(135deg,#a5f3fc,#22d3ee)}
.c1 .lt{background:linear-gradient(135deg,#ddd6fe,#a78bfa)}
.c2 .lt{background:linear-gradient(135deg,#fbcfe8,#f472b6)}
.c3 .lt{background:linear-gradient(135deg,#fde68a,#fbbf24)}
.ov{flex:1;text-align:center;font-size:31px;color:#fff;line-height:1.5}
.ov .m{color:#fff}
.cols4 .lt{width:40px;height:40px;font-size:21px}
.cols4 .ov{font-size:29px}
.cols4 .opt{gap:10px;padding:12px 12px}
.ec-foot{margin-top:22px;display:flex;justify-content:space-between;align-items:center;color:#8ea0c9;font-size:16px;font-weight:400}
.dots{display:flex;gap:7px}
.dots i{width:10px;height:10px;border-radius:50%;display:block}
.dots i:nth-child(1){background:#22d3ee}.dots i:nth-child(2){background:#a78bfa}.dots i:nth-child(3){background:#f472b6}

/* خط الأعداد */
.nl{position:relative;width:100%;height:100%;direction:ltr;font-family:'STIX Two Text','Noto Sans Math',serif}
.nl .ax{position:absolute;left:2%;right:2%;top:103px;height:3px;border-radius:2px;background:linear-gradient(90deg,#6366f1,#22d3ee,#6366f1)}
.nl .axl,.nl .axr{position:absolute;top:97px;width:0;height:0;border:7px solid transparent}
.nl .axl{left:0.4%;border-right:12px solid #6366f1;border-left:0}
.nl .axr{right:0.4%;border-left:12px solid #6366f1;border-right:0}
.nl .tk{position:absolute;top:98px;width:2px;height:13px;margin-left:-1px;background:#7c86c9}
.nl .tl{position:absolute;top:114px;width:44px;margin-left:-22px;text-align:center;font-size:21px;color:#dbe4ff}
.nl .tl .m{color:#dbe4ff;font-size:1em}
.nl .bar{position:absolute;height:8px;border-radius:4px;opacity:.92}
.nl .dt{position:absolute;width:18px;height:18px;margin-left:-9px;border-radius:50%;border:3px solid}
.nl .vl{position:absolute;width:0;margin-left:-1px;border-left:2px dashed;opacity:.7}
.nl .arrL,.nl .arrR{position:absolute;width:0;height:0;border:9px solid transparent}
.nl .pt{position:absolute;width:16px;height:16px;margin-left:-8px;top:96px;background:#fbbf24;transform:rotate(45deg);box-shadow:0 0 14px #fbbf24}
.nl .ptl{position:absolute;top:140px;width:90px;margin-left:-45px;text-align:center;font-size:20px;color:#fde68a}
.nl .ptl .m{color:#fde68a}
.venn-l{direction:ltr;unicode-bidi:isolate;position:absolute;font-family:'STIX Two Text','Noto Sans Math',serif;font-size:30px;font-weight:600;text-align:center;width:80px;margin-left:-40px;margin-top:-18px;line-height:1.2}

/* ============ تذييل ============ */
footer{text-align:center;color:#64748b;font-size:13px;padding:10px 0 40px}
#stage{position:absolute;left:-12000px;top:0;width:960px}
.modal{position:fixed;left:0;top:0;right:0;bottom:0;z-index:100;background:rgba(3,4,12,.8);display:none;align-items:center;justify-content:center}
.modal.on{display:flex}
.mbox{width:min(420px,88vw);padding:28px;border-radius:24px;background:#0d0f2e;border:1px solid rgba(165,180,252,.35);text-align:center}
.mbox h3{margin:0 0 6px;font-size:20px}
.mbox p{margin:0 0 18px;color:#a5b4fc;font-size:14px}
.pbar{height:12px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#a78bfa,#f472b6);transition:width .25s}
@media(max-width:700px){.toolbar{top:6px;border-radius:18px}.exp{top:14px;left:16px}}
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="gridbg"></div><div class="scan"></div></div>

<header class="hero">
  <div class="orbit">
    <svg viewBox="0 0 116 116">
      <defs><linearGradient id="og" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs>
      <g class="r1"><ellipse cx="58" cy="58" rx="54" ry="20" fill="none" stroke="url(#og)" stroke-width="2" transform="rotate(30 58 58)"/><circle cx="104" cy="40" r="5" fill="#22d3ee"/></g>
      <g class="r2"><ellipse cx="58" cy="58" rx="54" ry="20" fill="none" stroke="#a78bfa" stroke-width="2" opacity=".8" transform="rotate(-30 58 58)"/><circle cx="12" cy="40" r="5" fill="#f472b6"/></g>
      <circle cx="58" cy="58" r="20" fill="url(#og)"/>
      <path d="M46 59 L52 56 L58 68 L68 47 L74 47" fill="none" stroke="#06081a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <span class="eyebrow"><i></i> الصف الثاني الإعدادي · الوحدتان الأولى والثانية</span>
  <h1>مصنع الأسئلة</h1>
  <p class="sub">٧٥ سؤالًا في ثلاثة نماذج متكافئة. اضغط على الأيقونة المتحركة بجانب أي سؤال لتصدّره كصورة عالية الدقة — الإجابات تظهر هنا فقط ولا تدخل في الصورة.</p>
</header>

<div class="toolbar">
  <div class="tabs" id="tabs"></div>
  <div class="ctrls">
    <label class="sel">الصيغة <select id="fmt"><option value="png">PNG</option><option value="webp">WebP</option></select></label>
    <label class="sel">الدقة <select id="scale"><option value="2">2× عادية</option><option value="3" selected>3× عالية</option><option value="4">4× فائقة</option></select></label>
    <label class="tg"><input type="checkbox" id="showAns" checked><span class="sw"></span>الإجابات</label>
    <button class="zipbtn" id="zipBtn">تحميل النموذج ZIP</button>
  </div>
</div>

<main id="list"></main>
<footer>الإجابات الظاهرة أسفل كل سؤال لا تُضمَّن في الصور المُصدَّرة</footer>
<div id="stage"></div>
<div class="modal" id="modal"><div class="mbox"><h3>جارٍ تجهيز الصور…</h3><p id="mtxt">0 / 25</p><div class="pbar"><i id="mbar"></i></div></div></div>

<script>
/* ================== أدوات العرض الرياضي ================== */
const LET=['أ','ب','ج','د'];
const COL=['#22d3ee','#f472b6','#a3e635'];
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function grp(s,i){let d=0,j=i;for(;j<s.length;j++){if(s[j]==='{')d++;else if(s[j]==='}'){d--;if(d===0)break}}return[s.slice(i+1,j),j+1]}
function M(s){
  let out='',i=0;
  while(i<s.length){
    if(s.startsWith('____',i)){out+='<span class="blank"></span>';i+=4;continue}
    if(s.startsWith('frac{',i)){const[a,n]=grp(s,i+4);const[b,n2]=grp(s,n);out+=`<span class="fr"><span>${M(a)}</span><span>${M(b)}</span></span>`;i=n2;continue}
    const c=s[i];
    if((c==='√'||c==='∛')&&s[i+1]==='{'){const[a,n]=grp(s,i+1);out+=`<span class="rad">${c==='∛'?'<span class="ix">3</span>':''}<span class="rs">√</span><span class="rc">${M(a)}</span></span>`;i=n;continue}
    if(c==='^'&&s[i+1]==='{'){const[a,n]=grp(s,i+1);out+=`<sup>${M(a)}</sup>`;i=n;continue}
    out+=/[A-Za-z]/.test(c)?`<i>${c}</i>`:esc(c);i++;
  }
  return out;
}
function T(s){return s.split('$').map((p,k)=>k%2?`<span class="m">${M(p)}</span>`:esc(p).replace(/____/g,'<span class="blank"></span>')).join('')}
function R(o){return /[\u0600-\u06FF]/.test(o)?T(o):`<span class="m">${M(o)}</span>`}
const rawLen=o=>o.replace(/\s|[{}^$]|frac|√|∛/g,'').length;

/* ================== الرسومات التوضيحية ================== */
const DEFS=`<defs>
<linearGradient id="gC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#6366f1"/></linearGradient>

function NL(sp){
  const[a,b]=sp.r,P=v=>6+(v-a)/(b-a)*88,step=(b-a)>14?2:1,AX=104;
  let h='<div class="nl"><div class="ax"></div><div class="axl"></div><div class="axr"></div>';
  for(let t=Math.ceil(a);t<=b;t+=step)h+=`<div class="tk" style="left:${P(t)}%"></div><div class="tl" style="left:${P(t)}%"><span class="m">${M(String(t).replace('-','−'))}</span></div>`;
  const dot=(x,y,c,cl)=>`<div class="dt" style="left:${x}%;top:${y-4}px;border-color:${c};background:${cl?c:'#0a0c24'}"></div><div class="vl" style="left:${x}%;top:${y+14}px;height:${AX-y-14}px;border-color:${c}"></div>`;
  (sp.iv||[]).forEach((iv,k)=>{
    const[lo,hi,lc,hc]=iv,c=COL[k%3],y=AX-34-k*34,L=lo===null?2:P(lo),Rr=hi===null?98:P(hi);
    h+=`<div class="bar" style="left:${L}%;width:${Rr-L}%;top:${y}px;background:${c}"></div>`;
    h+=lo===null?`<div class="arrL" style="left:0.6%;top:${y-5}px;border-right-color:${c};border-left:0"></div>`:dot(L,y,c,lc==='c');
    h+=hi===null?`<div class="arrR" style="right:0.6%;top:${y-5}px;border-left-color:${c};border-right:0"></div>`:dot(Rr,y,c,hc==='c');
  });
  (sp.pt||[]).forEach(p=>{h+=`<div class="pt" style="left:${P(p[0])}%"></div>`+(p[1]?`<div class="ptl" style="left:${P(p[0])}%"><span class="m">${M(p[1])}</span></div>`:'')});
  return h+'</div>';
}

}
function tabs(){
  $('tabs').innerHTML=NAMES.map((n,i)=>`<button class="tab ${i===cur?'on':''}" data-i="${i}">${n}</button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;tabs();render();window.scrollTo({top:0,behavior:'smooth'})});
}

/* ================== التصدير ================== */
async function fontsReady(){
  try{await Promise.all([document.fonts.load('600 30px "IBM Plex Sans Arabic"'),document.fonts.load('400 30px "IBM Plex Sans Arabic"'),document.fonts.load('italic 500 30px "STIX Two Text"'),document.fonts.load('500 30px "STIX Two Text"'),document.fonts.load('30px "Noto Sans Math"'),document.fonts.load('700 30px "Space Grotesk"')]);await document.fonts.ready}catch(e){}
}
async function makeBlob(m,i){
  await fontsReady();
  const fmt=$('fmt').value,scale=+$('scale').value;
  const host=document.createElement('div');host.innerHTML=cardHTML(m,i,MODELS[m][i]);
  const clone=host.firstElementChild;$('stage').appendChild(clone);
  try{
    const canvas=await html2canvas(clone,{scale,backgroundColor:null,useCORS:true,logging:false});
    return await new Promise(r=>canvas.toBlob(r,fmt==='webp'?'image/webp':'image/png',0.97));
  }finally{clone.remove()}
}
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const pad=i=>String(i+1).padStart(2,'0');
async function exportOne(m,i,btn){
  if(btn.classList.contains('busy'))return;
  btn.classList.remove('done');btn.classList.add('busy');
  try{
    const blob=await makeBlob(m,i);
    save(blob,`model${m+1}-q${pad(i)}.${$('fmt').value}`);
    btn.classList.add('done');setTimeout(()=>btn.classList.remove('done'),2200);
  }catch(e){console.error(e);alert('حدث خطأ أثناء التصدير، تأكد من اتصال الإنترنت (الخطوط والمكتبات) وأعد المحاولة.')}
  btn.classList.remove('busy');
}
$('zipBtn').onclick=async()=>{
  const m=cur,n=MODELS[m].length,zip=new JSZip(),ext=$('fmt').value;
  $('modal').classList.add('on');
  try{
    for(let i=0;i<n;i++){
      $('mtxt').textContent=`${i+1} / ${n}`;$('mbar').style.width=((i)/n*100)+'%';
      zip.file(`M${m+1}-Q${pad(i)}.${ext}`,await makeBlob(m,i));
    }
    $('mtxt').textContent='جارٍ الضغط…';$('mbar').style.width='100%';
    save(await zip.generateAsync({type:'blob'}),`model${m+1}-questions.zip`);
  }catch(e){console.error(e);alert('تعذّر إنشاء الملف.')}
  $('modal').classList.remove('on');
};
$('showAns').onchange=e=>document.body.classList.toggle('hide-ans',!e.target.checked);
window.addEventListener('resize',fitAll);
tabs();render();
document.fonts.ready.then(fitAll);
</script>
